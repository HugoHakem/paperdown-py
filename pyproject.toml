[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[project]
name = "paperdown-py"
version = "0.1.0"
description = "A streamlined Python wrapper around GLM-OCR for local PDF-to-Markdown workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "glmocr[selfhosted] @ git+https://github.com/zai-org/GLM-OCR.git",
]

[project.optional-dependencies]
vllm = [
  "vllm>=0.19.0 ; sys_platform == 'linux' and python_version < '3.14'",
]
mlx = [
  "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
paperdown-py = "paperdown_py.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.0.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "mlx" },
    { extra = "vllm" },
  ],
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/paperdown_py"]

[tool.hatch.build.targets.sdist]
include = [
  "src/paperdown_py",
  "tests",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
